<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin panel | CampusPass</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="wrap page">
  <section id="gate" class="gate card" hidden>
    <h2>Administrator sign-in</h2>
    <p class="sub">Enter the admin API key. It is kept only until you close this tab.</p>
    <form id="gateForm" autocomplete="off">
      <div class="field"><label for="adminKey">Admin API key</label><input id="adminKey" class="mono" type="password" required></div>
      <div id="gateError" class="hint" style="color:var(--bad);margin:-8px 0 14px" role="alert"></div>
      <button class="btn" type="submit">Open admin panel</button>
    </form>
  </section>

  <div id="panel" hidden>
    <div class="page-head"><h1>Admin panel</h1><div class="btn-row"><button class="btn ghost small" id="reload" type="button">Refresh</button><button class="btn ghost small" id="signout" type="button">Sign out</button></div></div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="overview" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Overview</button>
      <button role="tab" data-tab="keys" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg>API keys</button>
      <button role="tab" data-tab="students" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></svg>Students</button>
      <button role="tab" data-tab="teachers" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/></svg>Teachers</button>
      <button role="tab" data-tab="activity" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</button>
    </div>

    <section id="tab-overview"></section>

    <section id="tab-keys" hidden>
      <div class="card">
        <h2>Generate a key</h2>
        <p class="sub">Each student or teacher can have one active key. Revoke the old one to issue a new one.</p>
        <form id="genForm">
          <div class="row">
            <div class="field"><label for="genRole">Key for</label><select id="genRole"><option value="student">Student</option><option value="teacher">Teacher</option></select></div>
            <div class="field" style="flex-grow:2"><label for="genOwner">Person</label><select id="genOwner" required></select></div>
            <div class="field"><label for="genLimit">Request limit</label><input id="genLimit" type="number" min="1" max="100000" value="10" required></div>
            <button class="btn" type="submit">Generate key</button>
          </div>
        </form>
        <div id="newKey"></div>
      </div>
      <div class="card"><h2>All keys</h2><p class="sub">Usage and status of every key.</p><div id="keysTable"></div></div>
    </section>

    <section id="tab-students" hidden></section>
    <section id="tab-teachers" hidden></section>
    <section id="tab-activity" hidden></section>
  </div>
</main>
<script src="/js/jquery.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
